# Build and publish a Docker image.
name: Build and publish docker images

on:
  push:
    branches: ["main"]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  UV_VERSION: 0.9
  PYTHON_VERSION: 3.12
  JUPYTER_VERSION: "2025-04-14"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # If you want to include custom documentation, create a fork of the repo below and link the forked repo here
  NOMAD_DOCS_REPO: https://github.com/FAIRmat-NFDI/nomad-docs.git
  NOMAD_DOCS_REPO_REF: "main"
  # If you want to skip the tests for some plugins, add them here as a single string where
  # each plugin is separated by whitespace
  PLUGIN_TESTS_PLUGINS_TO_SKIP: |
    simulationworkflowschema
    nomad_measurements

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  # Job 1: Update Lock File
  update-lockfile:
    name: Update Python Lock File
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Update lock file
        run: uv lock

      # Commits any changes made to the lockfile
      - name: Commit lock file changes
        if: github.ref_type != 'tag'
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          git add uv.lock
          if [[ `git status --porcelain` ]]; then
            git commit -m "Update lockfile"
            git push origin -o ci.skip # prevent triggering the pipeline again
          fi

  # Job 2: Run unit tests for all of the plugin
  plugin_unit_tests:
    name: Run plugin unit tests
    needs: update-lockfile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    env:
      PLUGIN_TESTS_CI_NODE_TOTAL: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run plugin tests
        env:
          PLUGIN_TESTS_CI_NODE_INDEX: ${{ matrix.group }}
          NOMAD_CONFIG: ${{ github.workspace }}/configs/nomad.yaml
        run: |
          # replace the yaml list with a string, use a `,` to separate the plugins
          PLUGINS_STRING=$(echo "$PLUGIN_TESTS_PLUGINS_TO_SKIP" | tr '\n' ',' | sed 's/,$//')
          uv run \
            --extra plugins \
            --with "nomad-plugin-tests" \
            nomad-plugin-tests --plugins-to-skip "$PLUGINS_STRING"

  # Job 3: Build and Push Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: update-lockfile

    strategy:
      fail-fast: false
      matrix:
        service:
          - app
          - jupyter
          # - cpu-action
          # - gpu-action
        include:
          - service: app
            target: final
            image_suffix: ""
          - service: jupyter
            target: jupyter
            image_suffix: /jupyter
          # - service: gpu-action
          #   target: gpu_action_final
          #   image_suffix: /gpu-action
          # - service: cpu-action
          #   target: cpu_action_final
          #   image_suffix: /cpu-action

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.image_suffix }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            UV_VERSION=${{ env.UV_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            NOMAD_DOCS_REPO=${{ env.NOMAD_DOCS_REPO }}
            NOMAD_DOCS_REPO_REF=${{ env.NOMAD_DOCS_REPO_REF }}
            JUPYTER_VERSION=${{ env.JUPYTER_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set image output
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "${{ matrix.service }}_IMAGE=$FIRST_TAG" >> $GITHUB_ENV

    outputs:
      app_image: ${{ env.app_IMAGE }}
      jupyter_image: ${{ env.jupyter_IMAGE }}

  # Job 4: Run example upload tests and entrypoint tests
  run_tests:
    name: Run example upload tests and entrypoint tests
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: ${{ needs.build.outputs.app_image }}
      JUPYTER_IMAGE: ${{ needs.build.outputs.jupyter_image }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: true

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start containers and check app/jupyter container health
        working-directory: tests
        run: |
          docker compose up -d --quiet-pull

          echo "Waiting for dependencies to be healthy..."
          timeout 180 bash -c '
            for svc in rabbitmq elastic mongo keycloak nomad_temporal; do
              until [ "$(docker inspect --format="{{.State.Health.Status}}" $svc 2>/dev/null)" = "healthy" ]; do
                sleep 3
              done
              echo "$svc is healthy"
            done
          '

          echo "Waiting for app and jupyter to be healthy (up to 10 min)..."
          
          wait_for_healthy() {
            local container="$1"
            local timeout_seconds="$2"
            local deadline=$((SECONDS + timeout_seconds))

            while (( SECONDS < deadline )); do
              status="$(docker inspect --format='{{.State.Status}}' "$container" 2>/dev/null || true)"
              health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null || true)"

              if [[ "$status" == "running" && "$health" == "healthy" ]]; then
                return 0
              fi

              if [[ "$health" == "none" ]]; then
                echo "$container has no Docker health check"
                return 1
              fi

              echo "$container status: $status, health: $health; retrying..."
              sleep 5
            done

            return 1
          }

          HEALTHY=true
          if ! wait_for_healthy app 620; then
            HEALTHY=false
          fi

          if [ "$HEALTHY" = "true" ]; then
            if ! wait_for_healthy jupyter 320; then
              HEALTHY=false
            fi
          fi

          if [ "$HEALTHY" != "true" ]; then
            echo "Containers failed health check."
            
            for container in app jupyter; do
              echo "=== $container status ==="
              docker inspect "$container" \
                --format='status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                || true

              echo "=== $container health log ==="
              docker inspect "$container" \
                --format='{{range .State.Health.Log}}{{printf "%s exit=%d output=%s\n" .Start .ExitCode .Output}}{{end}}' \
                || true

              echo "=== Logs for $container ==="
              docker logs "$container" || true
            done
            
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        working-directory: tests
        run: |
          export PLUGINS_STRING=$(echo "$PLUGIN_TESTS_PLUGINS_TO_SKIP" | tr '\n' ',' | sed 's/,$//')
          uv run --extra plugins pytest -p no:warnings -sv
